spring:
  application:
    name: myblog-springboot

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:myblog}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    # ⚠️ 不再提供硬编码默认密码；生产环境必须通过环境变量 DB_PASSWORD 设置
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    # ⚠️ date-format / time-zone 只作用于 java.util.Date / Calendar，
    #    对 java.time（LocalDateTime 等）**无效**；时间字段的 JSON 口径由
    #    config/JacksonConfig.java + app.time-zone 决定，别靠这两行对齐。
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    time-zone: Asia/Shanghai
    # ⚠️ 必须是 always（而非 non_null）：Express 的 utils/response.js 固定输出
    #    { code, message, data }，实体为 null 的字段也照常输出 null（"email": null、
    #    "authorUrl": null、"deletedAt": null、"data": null）。用 non_null 会把这些键
    #    整条略去 → 双端响应体在大量接口上不一致（需逐个 DTO 打 @JsonInclude(ALWAYS) 修补）。
    #    注意：JS 消费方对 null 与「键不存在」的取值行为一致（都 falsy），故不会影响前端渲染。
    default-property-inclusion: always

  # ── Redis 缓存配置 ──
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # ── 邮件通知（可选；未配置 SMTP 时 MailService 自动降级）──
  # SMTP_FROM 为可选发信人；缺省时回退到 SMTP_USER
  # SMTP_SECURE（加密方式）不在这里映射成布尔：它要的是「显式取值 → 否，则按端口推导」
  # 这种三态判断，占位符做不到。实际由 config/MailEncryption.java + MailTransportCustomizer.java
  # 推导后写入 mail.smtp.ssl.enable / starttls.enable / starttls.required，与 Express 同口径。
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    from: ${SMTP_FROM:}
    properties:
      mail:
        smtp:
          auth: true
        mail.debug: false

server:
  port: ${PORT:3000}
  # ── HTTP 压缩（等价于 Express compression 中间件）──
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  # ── 请求体大小限制 ──
  tomcat:
    max-http-form-post-size: 10MB

app:
  # 时间字段的「源时区」：无时区的 LocalDateTime 按此时区解释成瞬时后，
  # 输出 UTC 瞬时串（与 Express 逐字节一致）。
  # ⚠️ 必须等于「数据库写入端时区」：MySQL 会话 time_zone（docker-compose 里
  #    由 mysql 服务的 TZ 决定）/ Express 的 DB_TIME_ZONE / JDBC 的 serverTimezone。
  #    数据库若改为 UTC 存储，这里必须同步改，否则整体偏移 8 小时且不报错。
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  jwt:
    secret: ${JWT_SECRET:dev-secret-do-not-use-in-production}
    expiration-ms: ${JWT_EXPIRES_IN:604800000}
  upload:
    path: ${UPLOAD_PATH:uploads}
  blogger:
    username: ${BLOGGER_USERNAME:admin}
    password: ${BLOGGER_PASSWORD:admin123}
    nickname: ${BLOGGER_NICKNAME:博主}
    # 占位地址（example.com 是保留域名，没有 MX 记录）：真实通知会退信，请改成你自己的邮箱。
    # 与 Express 的 BLOGGER_EMAIL 默认值保持一致（原先本端写的是 admin@blog.com）。
    email: ${BLOGGER_EMAIL:admin@example.com}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3001}
  admin-origin: ${ADMIN_ORIGIN:http://localhost:5173}
  # 站点信息（邮件通知里的链接与署名）
  # ⚠️ site-url 未配置时取空串（与 Express 的 SITE_URL 同口径，不给 localhost 这类内置默认值，
  #    否则本端会把 http://localhost:3001/article/1 发给收信人）；留空时 MailService 会在发信出口打 warn。
  site-url: ${SITE_URL:}
  site-name: ${SITE_NAME:MyBlog}
  mail:
    # SMTP 加密方式：ssl / starttls / none（可选；留空则按端口推导：465 → ssl，587 → starttls）
    secure: ${SMTP_SECURE:}
  meilisearch:
    host: ${MEILI_HOST:127.0.0.1}
    port: ${MEILI_PORT:7700}
    master-key: ${MEILI_MASTER_KEY:}

# ── Actuator 监控（健康检查 + Prometheus 指标）──
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.myblog: DEBUG
  file:
    path: logs
