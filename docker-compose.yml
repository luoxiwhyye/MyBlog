# ============================================================
# docker-compose.yml — myblog 全栈 Docker 部署
# ============================================================
#
# 架构概览：
#   myblog-backend   → Express 或 Spring Boot（API 服务，端口 3000）
#   myblog-blog      → Nuxt 3 SSR 博客前台（端口 3001）
#   myblog-admin     → Vue 3 SPA 管理后台（端口 3002）
#   mysql            → MySQL 8.0 数据库
#   redis            → Redis 7 缓存
#
# 使用方式：
#   1. 复制 .env.docker.example 为 .env.docker 并修改配置
#   2. 启动：docker compose --env-file .env.docker up -d
#   3. 首次启动后需要初始化数据库，详见 DEPLOY.md
# ============================================================

# ── 公共片段：容器日志轮转 ──
# 不加限制时 json-file 日志会无限增长，长期会把磁盘写满（表现是某天突然全部服务写入失败）。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # MySQL 数据库
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: myblog-mysql
    restart: unless-stopped
    environment:
      # ⚠️ 决定 datetime 列的写入时区（NOW() / CURRENT_TIMESTAMP 取容器本地时间）。
      #    必须与后端 TZ 及 DB_TIME_ZONE / APP_TIME_ZONE 表示同一时区，
      #    否则时间字段会整体偏移且不报错（详见 DEPLOY.md「时间字段与时区」）。
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-myblog}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      # 只绑回环：这些端口只给宿主机上的 Nginx 与本机调试用，不需要对外暴露。
      # 若确实要做「IP 直连」部署（无反向代理），把 .env.docker 的 BIND_ADDR 改成 0.0.0.0，
      # 并务必在云安全组 / 防火墙上只放行必须的端口。
      - "${BIND_ADDR:-127.0.0.1}:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动初始化数据库结构
      - ./myblog-express/myblog-1.1.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD:-root}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks:
      - myblog-net

  # ==========================================
  # Redis 缓存
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: myblog-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - myblog-net

  # ==========================================
  # Meilisearch 全文搜索引擎
  # ==========================================
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: myblog-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-master-key-change-me}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    networks:
      - myblog-net

  # ==========================================
  # 后端 API 服务
  # 二选一：Express (Node.js) 或 Spring Boot (Java)
  # ==========================================

  # ── 选项 A：Express 后端 (默认) ──
  myblog-backend:
    build:
      context: ./myblog-express
      dockerfile: Dockerfile
    container_name: myblog-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # 后端进程时区（日志时间戳）；与 mysql / 前台的 TZ 保持一致
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-myblog}
      # 时间字段读时区（固定偏移）；必须与 mysql 服务的 TZ 表示同一时区
      DB_TIME_ZONE: ${DB_TIME_ZONE:-+08:00}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MEILI_HOST: ${MEILI_HOST:-meilisearch}
      MEILI_PORT: ${MEILI_PORT:-7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-master-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3001}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3002}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SITE_URL: ${SITE_URL:-http://localhost:3001}
      SITE_NAME: ${SITE_NAME:-MyBlog}
      APP_BASE_URL: ${APP_BASE_URL:-}
      # 占位地址：真实通知会退信，请改成自己的邮箱；库已有博主时需到后台「个人资料」改
      BLOGGER_EMAIL: ${BLOGGER_EMAIL:-admin@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - myblog-net

  # ── 选项 B：Spring Boot 后端（如果要使用，请注释掉上面的 Express 服务，取消下面的注释）──
  # myblog-backend:
  #   build:
  #     context: ./myblog-springboot
  #     dockerfile: Dockerfile
  #   container_name: myblog-backend
  #   restart: unless-stopped
  #   environment:
  #     DB_HOST: mysql
  #     DB_PORT: 3306
  #     DB_USER: root
  #     DB_PASSWORD: ${DB_PASSWORD:-root}
  #     DB_NAME: ${DB_NAME:-myblog}
  #     # 后端进程时区；必须与 mysql 服务的 TZ 表示同一时区
  #     TZ: ${TZ:-Asia/Shanghai}
  #     # 时间字段源时区（IANA 名称）；必须与 mysql 服务的 TZ 表示同一时区
  #     APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  #     MEILI_HOST: ${MEILI_HOST:-meilisearch}
  #     MEILI_PORT: ${MEILI_PORT:-7700}
  #     MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-master-key-change-me}
  #     JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  #     JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-604800000}
  #     TRUST_PROXY: ${TRUST_PROXY:-1}
  #     PORT: 3000
  #     UPLOAD_PATH: uploads
  #     APP_BASE_URL: ${APP_BASE_URL:-}
  #     BLOGGER_USERNAME: ${BLOGGER_USERNAME:-admin}
  #     BLOGGER_PASSWORD: ${BLOGGER_PASSWORD:-admin123}
  #     BLOGGER_NICKNAME: ${BLOGGER_NICKNAME:-博主}
  #     BLOGGER_EMAIL: ${BLOGGER_EMAIL:-admin@example.com}
  #     SITE_URL: ${SITE_URL:-http://localhost:3001}
  #     SITE_NAME: ${SITE_NAME:-MyBlog}
  #     # 邮件通知（可选，未配置则自动停用）
  #     SMTP_HOST: ${SMTP_HOST:-}
  #     SMTP_PORT: ${SMTP_PORT:-465}
  #     SMTP_SECURE: ${SMTP_SECURE:-}
  #     SMTP_USER: ${SMTP_USER:-}
  #     SMTP_PASS: ${SMTP_PASS:-}
  #     SMTP_FROM: ${SMTP_FROM:-}
  #   ports:
  #     - "${BACKEND_PORT:-3000}:3000"
  #   volumes:
  #     - uploads-data:/app/uploads
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - myblog-net

  # ==========================================
  # 博客前台 (Nuxt 3 SSR)
  # ==========================================
  myblog-blog:
    build:
      context: ./myblog-vue/myblog-blog
      dockerfile: Dockerfile
      args:
        NUXT_API_BASE: ${NUXT_API_BASE:-http://myblog-backend:3000/api/v1}
        NUXT_SITE_URL: ${NUXT_SITE_URL:-http://localhost:3001}
    container_name: myblog-blog
    restart: unless-stopped
    environment:
      NUXT_API_BASE: ${NUXT_API_BASE:-http://myblog-backend:3000/api/v1}
      NUXT_SITE_URL: ${NUXT_SITE_URL:-http://localhost:3001}
      # ⚠️ SSR 直出时间用的是容器时区：必须设为访客所在时区（默认 Asia/Shanghai），
      #    否则 SSR HTML 与浏览器水合结果可能跨天不一致。详见 DEPLOY.md「时间字段与时区」。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BLOG_PORT:-3001}:3001"
    depends_on:
      - myblog-backend
    logging: *default-logging
    networks:
      - myblog-net

  # ==========================================
  # 管理后台 (Vue 3 SPA + Nginx)
  # ==========================================
  myblog-admin:
    build:
      context: ./myblog-vue/myblog-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://myblog-backend:3000/api/v1}
    container_name: myblog-admin
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-3002}:80"
    depends_on:
      - myblog-backend
    logging: *default-logging
    networks:
      - myblog-net

  # ==========================================
  # 定时数据库备份（cron，每天 02:00 执行 backup.sh）
  # ==========================================
  myblog-backup:
    build:
      context: ./scripts
      dockerfile: backup.Dockerfile
    container_name: myblog-backup
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-myblog}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # uploads 目录（只读挂载）—— 图片是数据库之外的资产，两类备份必须成对
      UPLOAD_DIR: /uploads
      # 数据库备份的 cron 表达式（容器内 crond 解析），默认每天 02:00
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      # 图片备份的 cron 表达式，默认错开半小时，避免与 mysqldump 抢磁盘 IO
      UPLOAD_BACKUP_CRON: ${UPLOAD_BACKUP_CRON:-30 2 * * *}
      # rclone 远端名（如 oss:myblog-backup）—— 留空则备份只留在本机备份目录
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - backup-data:/backups
      # 备份容器只读上传目录：它不需要写任何东西
      - uploads-data:/uploads:ro
      # rclone 配置目录（只读）。宿主机上用 `rclone config` 配好远端后，
      # 容器里的备份脚本就能直接用它同步到对象存储（RCLONE_REMOTE 填远端名）。
      # 路径不存在时会自动建空目录，不影响其他功能。
      - ${RCLONE_CONFIG_DIR:-/root/.config/rclone}:/root/.config/rclone:ro
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging
    # 用 crond 前台模式，但通过 entrypoint 注入自定义 cron 表
    entrypoint: >
      /bin/sh -c "
      echo \"$${BACKUP_CRON} /bin/bash /scripts/backup.sh >> /var/log/myblog-backup.log 2>&1\" > /etc/crontabs/root &&
      echo \"$${UPLOAD_BACKUP_CRON} /bin/bash /scripts/backup-uploads.sh >> /var/log/myblog-backup.log 2>&1\" >> /etc/crontabs/root &&
      crond -f -l 8
      "
    networks:
      - myblog-net

# ==========================================
# 可选：单容器资源上限（内存紧张的机器上建议开启，避免单个容器 OOM 拖垮宿主机）
#
# 用法：在对应 service 下加一行 mem_limit。参考值（按实际内存调整）：
#   mysql            mem_limit: 1g
#   meilisearch      mem_limit: 512m
#   redis            mem_limit: 320m    # 与 redis 的 --maxmemory 256mb 留出余量
#   myblog-backend   mem_limit: 512m
#   myblog-blog      mem_limit: 512m
#   myblog-admin     mem_limit: 128m
#   myblog-backup    mem_limit: 128m
#
# 注意：这是上限而非预留，但设得过低会触发 OOM 重启（表现为容器反复 Restarting）。
# ==========================================
# 数据卷
# ==========================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  meili-data:
    driver: local
  uploads-data:
    driver: local
  backup-data:
    driver: local

# ==========================================
# 网络
# ==========================================
networks:
  myblog-net:
    driver: bridge
