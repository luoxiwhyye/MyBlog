# ============================================================
# O-05: Kubernetes 部署清单 (kustomize 风格)
# 使用方式：kubectl apply -k deploy/k8s/
# ============================================================

---
# ── Namespace ──
apiVersion: v1
kind: Namespace
metadata:
  name: myblog
---
# ── ConfigMap: 环境变量 ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: myblog-config
  namespace: myblog
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "myblog"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MEILI_HOST: "meilisearch"
  MEILI_PORT: "7700"
  # 两个入口域名（见文件末尾 Ingress）；CORS 白名单必须与页面实际 origin 逐字一致
  FRONTEND_ORIGIN: "https://blog.your-domain.com"
  ADMIN_ORIGIN: "https://admin.your-domain.com"
  NUXT_SITE_URL: "https://blog.your-domain.com"
  # 博客容器服务端访问 API 用，保持 Service 名不要改成公网域名
  NUXT_API_BASE: "http://backend:3000/api/v1"
  # 邮件里链接的前缀，必须是收信人能打开的地址
  SITE_URL: "https://blog.your-domain.com"
  SITE_NAME: "MyBlog"
  # 拼入库的图片绝对地址前缀；不填会写死 http://localhost:3000，后台图片会全部裂掉
  APP_BASE_URL: "https://blog.your-domain.com"
  # 经 Ingress 一跳反代
  TRUST_PROXY: "1"
---
# ── Secret: 敏感配置 ──
apiVersion: v1
kind: Secret
metadata:
  name: myblog-secret
  namespace: myblog
type: Opaque
stringData:
  DB_PASSWORD: "your-db-password"
  JWT_SECRET: "your-jwt-secret-change-me"
  REDIS_PASSWORD: ""
  MEILI_MASTER_KEY: "your-meili-key"
---
# ── Backend Deployment ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: myblog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myblog-backend
  template:
    metadata:
      labels:
        app: myblog-backend
    spec:
      containers:
        - name: backend
          image: myblog-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: myblog-config
            - secretRef:
                name: myblog-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# ── Backend Service ──
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: myblog
spec:
  selector:
    app: myblog-backend
  ports:
    - port: 3000
      targetPort: 3000
---
# ── Blog Deployment ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: myblog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myblog-blog
  template:
    metadata:
      labels:
        app: myblog-blog
    spec:
      containers:
        - name: blog
          image: myblog-blog:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: myblog-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
# ── Blog Service ──
apiVersion: v1
kind: Service
metadata:
  name: blog
  namespace: myblog
spec:
  selector:
    app: myblog-blog
  ports:
    - port: 3001
      targetPort: 3001
---
# ── Admin Deployment ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: myblog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myblog-admin
  template:
    metadata:
      labels:
        app: myblog-admin
    spec:
      containers:
        - name: admin
          image: myblog-admin:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
# ── Admin Service ──
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: myblog
spec:
  selector:
    app: myblog-admin
  ports:
    - port: 80
      targetPort: 80
---
# ── Ingress (需安装 ingress-nginx controller) ──
# 两个入口域名：
#   blog.your-domain.com  → 博客前台（Nuxt）；/api 与 /uploads 也走它转发
#   admin.your-domain.com → 管理后台（Vue SPA）
#
# ⚠️ 管理后台必须挂在「域名根」上，不能用 your-domain.com/admin 这种子路径：
#    它的构建未设置 Vite base，资源路径是 /assets/...，客户端路由前缀是 /admin/...
#    挂在子路径会表现为页面空白、静态资源 404（base 是构建期写死的，配 Ingress 改不回来）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myblog
  namespace: myblog
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/gzip-types: "application/json text/css application/javascript"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - blog.your-domain.com
        - admin.your-domain.com
      secretName: myblog-tls
  rules:
    # ── 博客前台 ──
    - host: blog.your-domain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog
                port:
                  number: 3001
    # ── 管理后台 ──
    - host: admin.your-domain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80
