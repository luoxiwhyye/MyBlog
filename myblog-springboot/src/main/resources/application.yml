spring:
  application:
    name: myblog-springboot

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:myblog}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: ${PORT:3000}

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-do-not-use-in-production}
    expiration-ms: ${JWT_EXPIRES_IN:604800000}
  upload:
    path: ${UPLOAD_PATH:uploads}
  blogger:
    username: ${BLOGGER_USERNAME:admin}
    password: ${BLOGGER_PASSWORD:admin123}
    nickname: ${BLOGGER_NICKNAME:博主}
    email: ${BLOGGER_EMAIL:admin@blog.com}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3001}
  admin-origin: ${ADMIN_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
    com.myblog: DEBUG
  file:
    path: logs
