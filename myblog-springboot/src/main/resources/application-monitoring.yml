# ============================================================
# O-02: Spring Boot Actuator + Micrometer
# 暴露 /actuator/health, /actuator/metrics, /actuator/prometheus
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s
    tags:
      application: myblog-springboot
  # O-01: JSON 日志格式（通过 logback-spring.xml 控制）
