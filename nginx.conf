# ============================================================
# O-06: Nginx 反向代理配置模板（生产级）
# 功能：SSL 终止、Gzip 压缩、缓存、安全头、WebSocket 支持
#
# 使用方式：
#   1. 把全文的 blog.example.com / admin.example.com 换成你的真实域名
#   2. 把证书路径换成实际路径（或先用 certbot --nginx 由它代管）
#   3. cp 到 /etc/nginx/sites-available/myblog && ln -s 到 sites-enabled
#   4. nginx -t && systemctl reload nginx
#
# 架构：两个入口域名
#   blog.example.com   → 博客前台（Nuxt SSR，容器 3001）
#   admin.example.com  → 管理后台（Vue SPA，容器 3002）
#
# ⚠️ 管理后台必须挂在「域名根」上，不能用 blog.example.com/admin 这种子路径：
#    它的构建未设置 Vite base，资源路径是 /assets/...，而客户端路由前缀是 /admin/...
#    挂在子路径会表现为页面空白、静态资源 404（前端地址是构建期写死的，配反代改不回来）。
#
# ⚠️ 关于「多个域名指向同一个博客」：
#    若你除了 blog.example.com 还让裸域 / www 也能访问（备案场景常见），有两种写法，
#    两种都可以，但要清楚各自的代价：
#      A) 全部 301 收敛到一个域名（本模板未内置，需自行加 server 块）
#         → 缓存只有一份、SEO 权重集中；代价是「换个域名地址栏会变」。
#      B) 多个域名各自直接提供内容（本模板下面的写法）
#         → 每个域名都能打开、页脚备案号一致；代价是**服务端页面缓存的键含 host，
#           每个域名会各存一份、各自过期**，会出现「某域名还是旧内容、另一个已更新」。
#         所以 blog 侧（myblog-vue/myblog-blog/nuxt.config.ts）已把 isr / swr 全部改为
#         实时 SSR，保证多域名内容一致。**若你要改回 isr/swr，请同时把多域名收敛成一个。**
# ============================================================

upstream backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream blog {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream admin {
    server 127.0.0.1:3002;
    keepalive 16;
}

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com www.blog.example.com admin.example.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS 博客前台 ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.example.com www.blog.example.com;

    # SSL 证书（请替换为实际路径）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── 日志 ──
    access_log /var/log/nginx/myblog-access.log combined buffer=16k;
    error_log  /var/log/nginx/myblog-error.log warn;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── 客户端上传限制 ──
    client_max_body_size 20m;

    # ===== 静态资源缓存 =====
    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|webp|avif|woff2?|css|js|map)$ {
        # 代理到博客前端
        proxy_pass http://blog;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 强缓存：图片/字体 30 天，JS/CSS 7 天
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 上传文件 =====
    # ^~ 让前缀匹配优先于上面的静态资源正则（否则 .jpg/.webp 会被正则抢走，绕过下面的缓存头）
    location ^~ /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    # ===== RSS/Sitemap (博客 Nuxt SSR) =====
    location /rss.xml {
        proxy_pass http://blog;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /sitemap.xml {
        proxy_pass http://blog;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ===== API 后端 =====
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时配置
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 16 16k;
    }

    # ===== 健康检查 =====
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ===== 博客前台 (Nuxt SSR — 默认路由) =====
    location / {
        proxy_pass http://blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===== 安全限制：拒绝隐藏文件 =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ── HTTPS 管理后台 ──
# ⚠️ 必须独立域名（挂在域名根），原因见文件头注释。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 日志 ──
    access_log /var/log/nginx/myblog-admin-access.log combined buffer=16k;
    error_log  /var/log/nginx/myblog-admin-error.log warn;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    # ── 客户端上传限制（后台要上传封面 / 头像 / 表情）──
    client_max_body_size 20m;

    # ===== API 后端 =====
    # 后台用相对路径 /api/v1 调接口（VITE_API_BASE=/api/v1），同源转发即可。
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===== 上传文件 =====
    # 后台把库里的绝对地址直接绑到 <img src>，指向哪个域名就要能取到图。
    location ^~ /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    # ===== SPA 静态资源（带内容哈希，长缓存）=====
    location /assets/ {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===== SPA 入口与客户端路由 =====
    # 容器内的 Nginx 已做 index.html 回退，这里原样转发；HTML 不进缓存。
    location / {
        proxy_pass http://admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ===== 安全限制：拒绝隐藏文件 =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
